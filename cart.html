<!DOCTYPE html>
<html>

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <link rel="shortcut icon" href="images/favicon.png" type="">

  <title> Dulce Mae - Carrito de Compras </title>

  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />

  <!-- font awesome style -->
  <link href="css/font-awesome.min.css" rel="stylesheet" />

  <!-- Custom styles for this template -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="css/responsive.css" rel="stylesheet" />

  <style>
    .cart-section .cart-container {
      margin-top: 40px;
    }
    .cart-table {
      width: 100%;
      margin-bottom: 1rem;
      color: #212529;
      border-collapse: collapse;
    }
    .cart-table th, .cart-table td {
      padding: 0.75rem;
      vertical-align: middle;
      border-top: 1px solid #dee2e6;
      text-align: center;
    }
    .cart-table thead th {
      vertical-align: bottom;
      border-bottom: 2px solid #dee2e6;
      background-color: #f8f9fa;
    }
    .cart-item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
    }
    .cart-total {
      text-align: right;
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 20px;
    }
    .btn-remove {
      color: #dc3545;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .empty-cart-message {
        text-align: center;
        padding: 50px;
        font-size: 1.2rem;
    }
  </style>
</head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img src="images/hero-bg.jpg" alt="">
    </div>
    <!-- header section starts -->
    <header class="header_section">
        <!-- ... (Tu header de siempre, no lo pego para no alargar) ... -->
    </header>
    <!-- end header section -->
  </div>

  <!-- cart section -->
  <section class="cart_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Tu Carrito de Compras
        </h2>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="cart-container">
            <table class="cart-table">
              <thead>
                <tr>
                  <th style="width: 10%;">Producto</th>
                  <th style="width: 40%;"></th>
                  <th style="width: 15%;">Precio</th>
                  <th style="width: 15%;">Cantidad</th>
                  <th style="width: 15%;">Subtotal</th>
                  <th style="width: 5%;"></th>
                </tr>
              </thead>
              <tbody id="cart-items-container">
                <!-- Las filas del carrito se insertarán aquí -->
              </tbody>
            </table>
            <div id="cart-summary">
              <!-- El total y el botón de pago irán aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end cart section -->

  <!-- footer section -->
  <footer class="footer_section">
      <!-- ... (Tu footer de siempre) ... -->
  </footer>
  <!-- footer section -->

  <!-- jQuery -->
  <script src="js/jquery-3.4.1.min.js"></script>
  <!-- popper js -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <!-- bootstrap js -->
  <script src="js/bootstrap.js"></script>
  <!-- custom js -->
  <script src="js/custom.js"></script>

  <!-- ========= INICIO DEL SCRIPT PARA RENDERIZAR EL CARRITO ========= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const cartItemsContainer = document.getElementById('cart-items-container');
        const cartSummaryContainer = document.getElementById('cart-summary');

        const localCart = {
            get: () => JSON.parse(localStorage.getItem('dulceMaeCart')) || [],
            save: (cart) => {
                localStorage.setItem('dulceMaeCart', JSON.stringify(cart));
                window.dispatchEvent(new CustomEvent('cartUpdated')); // Notificar a otras partes (como el header)
            },
            removeItem: (productId) => {
                let cart = localCart.get();
                cart = cart.filter(item => item._id !== productId);
                localCart.save(cart);
                renderCart(); // Volver a dibujar el carrito
            }
        };

        const renderCart = () => {
            const cart = localCart.get();
            cartItemsContainer.innerHTML = ''; // Limpiar la tabla
            cartSummaryContainer.innerHTML = ''; // Limpiar el resumen

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<tr><td colspan="6" class="empty-cart-message">Tu carrito está vacío. ¡Añade algunos productos!</td></tr>';
                return;
            }

            let total = 0;

            cart.forEach(item => {
                const subtotal = item.precio * item.quantity;
                total += subtotal;

                const cartItemRow = `
                    <tr>
                        <td><img src="${item.imagenUrl}" alt="${item.nombre}" class="cart-item-image"></td>
                        <td>${item.nombre}</td>
                        <td>$${item.precio.toLocaleString('es-CL')}</td>
                        <td>${item.quantity}</td>
                        <td>$${subtotal.toLocaleString('es-CL')}</td>
                        <td><i class="fa fa-trash btn-remove" data-product-id="${item._id}"></i></td>
                    </tr>
                `;
                cartItemsContainer.innerHTML += cartItemRow;
            });

            const cartSummary = `
                <div class="cart-total">
                    <p>Total: $${total.toLocaleString('es-CL')}</p>
                </div>
                <div class="btn_box" style="display: flex; justify-content: flex-end;">
                    <a href="book.html" class="order_online">Proceder al Pago</a>
                </div>
            `;
            cartSummaryContainer.innerHTML = cartSummary;
        };

        // Event listener para los botones de eliminar
        cartItemsContainer.addEventListener('click', (event) => {
            if (event.target.classList.contains('btn-remove')) {
                const productId = event.target.dataset.productId;
                if (confirm('¿Estás seguro de que quieres eliminar este producto del carrito?')) {
                    localCart.removeItem(productId);
                }
            }
        });

        // Renderizar el carrito al cargar la página
        renderCart();
    });
  </script>
  <!-- ========= FIN DEL SCRIPT ========= -->

</body>
</html>
