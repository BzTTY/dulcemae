<!DOCTYPE html>
<html>
<head>
    <!-- ... (Toda tu sección <head> es igual a la de las otras páginas) ... -->
    <title>Dulce Mae - Finalizar Pedido</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link href="css/font-awesome.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
</head>
<body class="sub_page">
    <div class="hero_area">
        <div class="bg-box">
            <img src="images/hero-bg.jpg" alt="">
        </div>
        <!-- ... (Pega aquí tu <header> completo, igual que en las otras páginas) ... -->
    </div>

    <!-- book section -->
    <section class="book_section layout_padding">
        <div class="container">
            <div class="heading_container">
                <h2>
                    Finaliza tu Pedido
                </h2>
            </div>
            <div class="row">
                <div class="col-md-7">
                    <div class="form_container">
                        <form id="checkoutForm">
                            <h4>Información de Contacto y Entrega</h4>
                            <div id="messageContainer" style="display: none; margin-bottom: 15px;"></div>
                            <div>
                                <input type="text" id="nombre_cliente" class="form-control" placeholder="Tu Nombre Completo" required />
                            </div>
                            <div>
                                <input type="text" id="telefono_cliente" class="form-control" placeholder="Tu Número de Teléfono" required />
                            </div>
                            <div>
                                <input type="email" id="correo_cliente" class="form-control" placeholder="Tu Correo Electrónico" required />
                            </div>
                            <div>
                                <input type="text" id="direccion_entrega" class="form-control" placeholder="Dirección de Entrega" required />
                            </div>
                             <div>
                                <textarea id="notas_pedido" class="form-control" placeholder="Notas adicionales para tu pedido (opcional)"></textarea>
                            </div>
                            <div class="btn_box">
                                <button type="submit" id="submitOrderBtn">
                                    Confirmar Pedido
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="order_summary">
                        <h4>Resumen de tu Carrito</h4>
                        <div id="summary-cart-items"></div>
                        <hr>
                        <h5 id="summary-total" style="text-align: right; font-weight: bold;"></h5>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- end book section -->

    <!-- ... (Pega aquí tu <footer> completo) ... -->

    <!-- Scripts -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/custom.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summaryItemsContainer = document.getElementById('summary-cart-items');
            const summaryTotalContainer = document.getElementById('summary-total');
            const checkoutForm = document.getElementById('checkoutForm');
            const messageContainer = document.getElementById('messageContainer');
            const apiBaseUrl = 'https://dulcemae.onrender.com';

            const cart = JSON.parse(localStorage.getItem('dulceMaeCart')) || [];

            // --- Renderizar el resumen del carrito ---
            if (cart.length === 0) {
                summaryItemsContainer.innerHTML = '<p>No hay productos en tu carrito.</p>';
                document.getElementById('submitOrderBtn').disabled = true;
            } else {
                let total = 0;
                let itemsHtml = '<ul>';
                cart.forEach(item => {
                    const subtotal = item.precio * item.quantity;
                    total += subtotal;
                    itemsHtml += `<li>${item.quantity} x ${item.nombre} - <strong>$${subtotal.toLocaleString('es-CL')}</strong></li>`;
                });
                itemsHtml += '</ul>';
                summaryItemsContainer.innerHTML = itemsHtml;
                summaryTotalContainer.innerHTML = `Total: $${total.toLocaleString('es-CL')}`;
            }

            // --- Manejar el envío del formulario ---
            checkoutForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const submitButton = document.getElementById('submitOrderBtn');
                submitButton.disabled = true;
                submitButton.textContent = 'Procesando...';

                const orderDetails = {
                    nombreCliente: document.getElementById('nombre_cliente').value,
                    telefono: document.getElementById('telefono_cliente').value,
                    correo: document.getElementById('correo_cliente').value,
                    direccion: document.getElementById('direccion_entrega').value,
                    notas: document.getElementById('notas_pedido').value,
                    items: cart,
                    total: cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0)
                };

                try {
                    // Este es el endpoint que NECESITARÁS CREAR en tu backend
                    const response = await fetch(`${apiBaseUrl}/api/orders` , {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // Si estuvieras logueado, enviaríamos el token:
                            // 'Authorization': `Bearer ${localStorage.getItem('userToken')}`
                        },
                        body: JSON.stringify(orderDetails)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.message || 'Hubo un error al procesar el pedido.');
                    }

                    // Pedido exitoso
                    messageContainer.innerHTML = `<div class="alert alert-success">¡Gracias! Tu pedido ha sido recibido. Te hemos enviado un correo de confirmación.</div>`;
                    messageContainer.style.display = 'block';
                    localStorage.removeItem('dulceMaeCart'); // Limpiar el carrito
                    window.dispatchEvent(new CustomEvent('cartUpdated')); // Actualizar ícono del header
                    checkoutForm.reset();
                    submitButton.style.display = 'none'; // Ocultar el botón de confirmar

                } catch (error) {
                    messageContainer.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                    messageContainer.style.display = 'block';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Confirmar Pedido';
                }
            });
        });
    </script>
</body>
</html>
